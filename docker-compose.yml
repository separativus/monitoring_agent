# Pinned project name: keeps the compose project label (and thus the server-side
# `stack` label) identical on every host, regardless of checkout directory name.
name: monitoring_agent

# The compose file is identical on every host. Per-host input comes from .env
# next to this file (template: .env.example, seeded by deploy.sh):
#   BIND_IP             required - host address the exporters bind to
#   CADVISOR_MEM_LIMIT  optional - default 1g   (pi: 512m)
#   CADVISOR_CPUS       optional - default 2.0  (pi: 1.0)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------------------
  # Node Exporter - Host metrics (CPU, RAM, disk, network)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "${BIND_IP:?set BIND_IP in .env, see .env.example}:9100:9100"
    healthcheck:
      # Probe "/" (landing page), not /metrics: wget --spider closes the
      # connection after the headers and node-exporter then logs one
      # "broken pipe" error per unflushed metric family, hundreds of lines
      # every 30 s (4 GB json log on hydra before this was changed).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    mem_limit: 128m
    cpus: 0.5

  # ---------------------------------------------------------------------------
  # cAdvisor - Container metrics (CPU, RAM, network, disk per container)
  # ---------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # Default disabled set of v0.55.1 plus "disk": with the containerd
      # snapshotter the per-container fs-usage walk covers the whole merged
      # rootfs, starves the /metrics handler and OOMs the container.
      # No dashboard uses container_fs_usage/inodes.
      - '--disable_metrics=disk,advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp'
    ports:
      - "${BIND_IP:?set BIND_IP in .env, see .env.example}:8080:8080"
    tmpfs:
      # Scratch space for the healthcheck's dockerd-PID marker. A tmpfs is
      # empty on every container (re)start, so a fresh cAdvisor never
      # inherits a stale PID and cannot kill itself in a loop.
      - /tmp
    healthcheck:
      # Two jobs: (1) liveness via /healthz, (2) re-attach after a dockerd
      # restart. cAdvisor keeps the Docker connection it opened at start;
      # after dockerd restarts (live-restore keeps the containers running)
      # it stays up and "healthy" but reports no containers at all
      # (container_last_seen{name!=""} drops to 0). The check remembers
      # dockerd's PID from /var/run/docker.pid (host /var/run is mounted)
      # and, when it changes, terminates PID 1; restart: unless-stopped
      # brings cAdvisor back, freshly attached. No root, no sidecar needed.
      test:
        - CMD-SHELL
        - |
          pid=$$(cat /var/run/docker.pid 2>/dev/null); [ -n "$$pid" ] || exit 1
          if [ -s /tmp/dockerd.pid ] && [ "$$(cat /tmp/dockerd.pid)" != "$$pid" ]; then
            echo "dockerd restarted ($$(cat /tmp/dockerd.pid) -> $$pid): re-attaching"; kill 1; exit 1
          fi
          echo "$$pid" > /tmp/dockerd.pid
          exec wget --quiet --tries=1 --spider http://localhost:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    mem_limit: ${CADVISOR_MEM_LIMIT:-1g}
    cpus: ${CADVISOR_CPUS:-2.0}
